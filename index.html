<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/shared/assets/logos/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JNUBazaar — Buy. Sell. Connect. — Inside JNU</title>
    <meta name="description" content="Dedicated student-to-student marketplace exclusively for Jawaharlal Nehru University (JNU), New Delhi. Zero commission, verified @jnu.ac.in community, safe campus handovers." />
    <script>
      try {
        if (localStorage.getItem("jnubazaar_theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "#111827";
          document.body.style.backgroundColor = "#111827";
        }
      } catch {}

    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; }
      body { background: #f7f9ff; }
      #root { min-height: 100vh; background: inherit; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper-50 text-navy-950 font-sans antialiased selection:bg-campus-blue selection:text-white min-h-screen">

  </body>
</html>
